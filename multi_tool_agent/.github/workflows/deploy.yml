name: Build & Deploy Agent to Cloud Run

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT }}
        export_default_credentials: true

    - name: Configure Docker auth for Artifact Registry
      run: |
        gcloud auth configure-docker ${ { secrets.GCP_REGION }}-docker.pkg.dev --quiet

    - name: Build Docker image
      run: |
        IMAGE_URL=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/agent-demo-repo/agent-demo:${{ github.sha }}
        docker build -t $IMAGE_URL .
        docker push $IMAGE_URL
      env:
        GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        GCP_REGION: ${{ secrets.GCP_REGION }}

    - name: Deploy to Cloud Run
      run: |
        IMAGE_URL=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/agent-demo-repo/agent-demo:${{ github.sha }}
        gcloud run deploy agent-demo \
          --image $IMAGE_URL \
          --region ${{ secrets.GCP_REGION }} \
          --service-account agent-run-sa@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com \
          --platform managed \
          --allow-unauthenticated
